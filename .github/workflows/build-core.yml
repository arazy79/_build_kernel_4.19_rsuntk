name: Workflow Core for Build Kernel
on:
  workflow_call:
    inputs:
      KERNEL_REPO:
        description: 'Kernel URL repository'
        type: string
      BRANCH:
        description: 'Kernel branch'
        type: string
      DEVICE_TARGET:
        description: 'Device to build'
        type: string
      
      # >>> TAMBAHAN BARU: Terima input dari build.yml <<<
      CUSTOM_ARTIFACT_NAME:
        description: 'Custom Artifact Name'
        type: string
        default: ''
      
      ENABLE_KSU:
        description: 'Enable KernelSU'
        type: boolean
        default: true
      KSU:
        description: 'Add KernelSU support'
        default: "NULL"
        type: string
      KSU_BRANCH:
        description: 'KernelSU branch'
        type: string
        default: 'main'
      ENABLE_SUSFS:
        description: 'Add SUSFS (needs KernelSU enabled)'
        type: boolean
        default: false
      SUSFS_REPO:
        description: 'SUSFS repository'
        type: string
        default: 'https://gitlab.com/simonpunk/susfs4ksu.git'
      SUSFS_BRANCH:
        description: 'SUSFS branch'
        type: string
        default: 'kernel-4.19'
      UPDATE_TOOLCHAIN:
        description: 'Update toolchain cache'
        type: boolean
        default: false
      USE_GCC:
        description: 'Use GCC for compilation instead of LLVM'
        type: boolean
        default: false
      KCFLAGS_W:
        description: 'Enable KCFLAGS=-w'
        type: boolean
        default: false
      EXTRA_CONFIG:
        description: 'Use Extra defconfig'
        type: string
        default: 'NULL'
      NEED_UPLOAD:
        description: 'Upload kernel to Telegram'
        type: boolean
        default: false

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    steps:
    # ... (Step Set Timezone, Checkout, SSH, Clone, Compiler, Cache, Prepare, Setup Build Environment, Fetch Toolchains, Build Kernel tetap SAMA PERSIS seperti punya lu) ...
    # Gue skip bagian tengah biar nggak kepanjangan, fokus ke bagian Upload aja.

    - name: Upload patch rejects
      if: failure()
      uses: actions/upload-artifact@v5
      with:
        name: patch-rejects
        path: kernel_root/**/*.rej
        if-no-files-found: ignore
        retention-days: 3

    # >>> UBAH BAGIAN INI: Logika Nama Artifact Kernel <<<
    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v5
      with:
        # Jika CUSTOM_ARTIFACT_NAME diisi, pakai itu. Jika kosong, pakai default.
        name: ${{ inputs.CUSTOM_ARTIFACT_NAME != '' && inputs.CUSTOM_ARTIFACT_NAME || format('Kernel-{0}', steps.buildKernel.outputs.buildDetails) }}
        path: |
          kernel_root/out/arch/arm64/boot/Image.gz-dtb
          kernel_root/out/.config
        retention-days: 5

    # >>> UBAH BAGIAN INI: Logika Nama Artifact AnyKernel3 <<<
    - name: Upload AnyKernel3 artifacts
      uses: actions/upload-artifact@v5
      with:
        # Jika CUSTOM_ARTIFACT_NAME diisi, tambahkan suffix '-AK3' biar nggak bentrok sama file kernel di atas.
        # Jika kosong, pakai default AK3-{buildDetails}.
        name: ${{ inputs.CUSTOM_ARTIFACT_NAME != '' && format('{0}-AK3', inputs.CUSTOM_ARTIFACT_NAME) || format('AK3-{0}', steps.buildKernel.outputs.buildDetails) }}
        path: kernel_root/AnyKernel3/*
        retention-days: 5
